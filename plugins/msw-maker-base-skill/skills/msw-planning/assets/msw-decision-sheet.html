<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design choices</title>
<!--
  msw-planning decision sheet — PRE-BUILT, READ-ONLY briefing form shipped with the skill.
  * Renders the CURRENT design choice (decision-data.json, authored per gate by the session).
  * This sheet only BRIEFS — the actual answer is given in the chat, matching the A/B/C labels.
  * decision-data.json is transient presentation data, never a planning record (the GDD is).
  * AI agents: never edit this form, never read it (or decision-data.json) back as input.
 * The gate is fetched and JSON.parse'd — never executed — so a tampered or badly quoted
 * file can only fail to parse. That is also why the page must be served over http.
-->
<style>
  :root {
    --bg: #eef1f6; --card: #ffffff; --text: #1b2030; --muted: #5a6474; --line: #e5e8ee;
    --brand1: #5b6cff; --brand2: #9b59ff; --brand-soft: #eef0ff;
    /* the hero is the only place white text sits on the accent, and the accent itself is tuned for
       small text ON a light surface — a separate, darker pair keeps white text at AA there */
    --hero1: #4453d6; --hero2: #7b3fd6;
    --wait: #ef7d00; --wait-soft: #fff2e2;
    --done: #17b26a; --done-soft: #e6f7ef;
    --pick: #7a5af5; --pick-soft: #efeaff;
    --shadow: 0 10px 30px rgba(30, 40, 80, .08);
    /* text colors for soft backgrounds — in light mode the raw accents drop to 2.4–3.7 contrast */
    --ink-brand: #3a49d6; --ink-wait: #9a4d00; --ink-done: #0f7a48; --ink-pick: #5b3fd6; --ink-danger: #c2373b;
    /* filled surfaces that carry WHITE text (number badge, copy button, its success flash). The raw
       accents are tuned for coloured text on a soft background and are far too light underneath
       white — these are the darker variants, plus the edge colour for the selected-card border. */
    --brand-solid: #4453d6; --done-solid: #0f7a48; --done-edge: #0f7a48;
  }
  .dark {
    --bg: #12141a; --card: #1c1f28; --text: #eceef2; --muted: #98a0ae; --line: #2b2f3a;
    --brand1: #7d8bff; --brand2: #b07aff; --brand-soft: #262b45;
    --hero1: #5566d9; --hero2: #8452d9;
    --wait: #ffa040; --wait-soft: #3c2c17;
    --done: #34d38b; --done-soft: #17352a;
    --pick: #b9a6ff; --pick-soft: #2c2350;
    --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    /* dark mode accents are already bright enough — only the danger color is lifted a step */
    --ink-brand: var(--brand1); --ink-wait: var(--wait); --ink-done: var(--done); --ink-pick: var(--pick); --ink-danger: #ff8a8d;
    /* dark keeps a brighter selected-border (it sits on a dark card) but still needs darker fills */
    --brand-solid: #5566d9; --done-solid: #118350; --done-edge: var(--done);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    /* CJK text with word-break:normal wraps between syllables, which cuts a word in half mid-line;
       keep-all breaks on spaces only. Long unbreakable tokens (RUIDs, URLs) still wrap via
       break-word so they cannot overflow. */
    word-break: keep-all; overflow-wrap: break-word;
  }
  #wrap { max-width: 980px; margin: 0 auto; padding: 26px 18px 110px; }
  .ansbar .inner { max-width: 980px; }   /* same base width as #wrap — the media queries below widen both together */
  /* responsive: widen the container on large screens so option cards fit on one row */
  @media (min-width: 1100px) {
    #wrap, .ansbar .inner { max-width: 1320px; }
    .qcard h1 { font-size: 27px; }
  }
  @media (min-width: 1600px) { #wrap, .ansbar .inner { max-width: 1520px; } }
  .topbar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 10px; }
  .topbar button { background: var(--card); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; min-height: 40px; cursor: pointer; font-size: 12.5px; }

  .qcard { background: linear-gradient(135deg, var(--hero1), var(--hero2)); color: #fff; border-radius: 24px; padding: 26px 30px; box-shadow: var(--shadow); margin-bottom: 20px; }
  .qcard .qbadge { display: inline-block; background: rgba(0,0,0,.22); border-radius: 999px; padding: 4px 14px; font-size: 12px; font-weight: 700; }
  .qcard h1 { margin: 12px 0 8px; font-size: 24px; line-height: 1.4; }
  .qcard .heroq { margin: 0 0 10px; font-size: 17px; font-weight: 800; line-height: 1.5; }
  /* keep the data's \n as real line breaks; no width cap, so the banner's right side isn't left empty on wide screens */
  .qcard .ctx { font-size: 13.5px; line-height: 1.75; opacity: .92; white-space: pre-line; }
  .qcard .ctx + .ctx { margin-top: 8px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
  .opt { background: var(--card); border-radius: 24px; box-shadow: var(--shadow); padding: 24px 24px 20px; position: relative; border: 2px solid transparent; display: flex; flex-direction: column; }
  .opt.rec { border-color: var(--brand1); }
  /* the recommend ribbon shares the row with the id and the selected badge (it was corner-absolute, so the badges sat at different heights) */
  .opt .ribbon { margin-left: auto; flex: none; white-space: nowrap; background: var(--brand-soft); color: var(--ink-brand); font-size: 11.5px; font-weight: 800; border-radius: 999px; padding: 4px 12px; }
  /* id (A/B/C) and the "selected" badge side by side — the badge used to be stamped on top of the id */
  .opt .opthead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; min-height: 44px; }
  .opt .oid {
    width: 44px; height: 44px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 900; background: var(--brand-soft); color: var(--ink-brand);
  }
  .opt .oid.multi { border-radius: 12px; background: var(--pick-soft); color: var(--ink-pick); }   /* multi-select = square */
  .opt h3 { margin: 0 0 2px; font-size: 18px; line-height: 1.4; }
  .opt .tagline { color: var(--muted); font-size: 13px; line-height: 1.6; margin-bottom: 14px; }
  .visual { background: var(--bg); border-radius: 16px; padding: 10px; margin-bottom: 14px; display: flex; align-items: center; justify-content: center; min-height: 130px; }
  .visual svg { width: 100%; max-width: 230px; height: auto; }
  .visual .bigemoji { font-size: 56px; }
  .sect { font-size: 11.5px; font-weight: 800; letter-spacing: .08em; color: var(--muted); margin: 10px 0 6px; }
  .opt ul { margin: 0; padding-left: 18px; font-size: 13.5px; line-height: 1.75; }
  .mvp { background: var(--brand-soft); border-radius: 12px; padding: 10px 14px; font-size: 13px; line-height: 1.6; margin-top: 12px; }
  .mvp b { color: var(--ink-brand); }
  .trade { background: var(--wait-soft); border-radius: 12px; padding: 10px 14px; font-size: 13px; line-height: 1.6; margin-top: 10px; }
  .trade b { color: var(--ink-wait); }
  .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .badge { font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 4px 12px; background: var(--bg); color: var(--muted); }
  .badge.e1 { background: var(--done-soft); color: var(--ink-done); }
  .badge.e2 { background: var(--wait-soft); color: var(--ink-wait); }
  .badge.e3 { background: var(--wait-soft); color: var(--ink-danger); }

  /* selected state */
  .opt { cursor: pointer; }
  .opt:hover { border-color: var(--line); }
  .opt.sel { border-color: var(--done-edge); }
  .opt .selbadge {
    display: none; flex: none; white-space: nowrap;
    background: var(--done-soft); color: var(--ink-done); font-size: 11.5px; font-weight: 800;
    border-radius: 999px; padding: 4px 12px;
  }
  .opt.sel .selbadge { display: inline-block; }

  .selmode { margin-top: 10px; font-size: 12.5px; opacity: .85; }

  /* multi-question block */
  .qblock { margin-bottom: 26px; }
  .qhead { display: flex; gap: 14px; align-items: flex-start; margin: 0 4px 14px; }
  .qnum {
    width: 30px; height: 30px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--brand-solid); color: #fff; font-size: 14px; font-weight: 800;
  }
  .qtitle { font-size: 17px; font-weight: 800; line-height: 1.45; }
  /* selection-mode tag — a visible label instead of small grey text */
  .qmode {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 8px;
    border-radius: 999px; padding: 5px 13px; font-size: 12.5px; font-weight: 800; letter-spacing: -.01em;
  }
  .qmode.single { background: var(--brand-soft); color: var(--ink-brand); }
  .qmode.multi { background: var(--pick-soft); color: var(--ink-pick); }
  .qcard .qmode { background: rgba(0,0,0,.22); color: #fff; }
  .qctx { font-size: 12.5px; color: var(--muted); line-height: 1.65; margin-top: 3px; white-space: pre-line; }
  .delegate {
    margin: 12px 4px 0; display: inline-block; cursor: pointer; user-select: none;
    background: var(--card); border: 2px dashed var(--line); border-radius: 999px;
    padding: 9px 18px; font-size: 13px; color: var(--muted);
  }
  .delegate:hover { color: var(--text); }
  .delegate.sel { border-style: solid; border-color: var(--done); color: var(--ink-done); font-weight: 700; }
  .escapes { display: flex; gap: 10px; flex-wrap: wrap; }
  .delegate.custom.sel { border-color: var(--brand1); color: var(--ink-brand); }
  .qfoot textarea.needs { border-color: var(--brand1); background: var(--brand-soft); }

  /* per-question note + copy-this-item */
  .qfoot { display: flex; gap: 12px; align-items: flex-start; margin: 14px 4px 0; flex-wrap: wrap; }
  .qfoot textarea {
    flex: 1; min-width: 240px; min-height: 44px; resize: vertical; font-family: inherit; font-size: 13px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--text);
  }
  .qfoot textarea:focus { outline: 2px solid var(--brand1); border-color: transparent; }
  .qcopy {
    flex: none; background: var(--brand-soft); color: var(--ink-brand); border: none; border-radius: 999px;
    padding: 11px 20px; font-size: 13px; font-weight: 800; cursor: pointer;
  }
  .qcopy:disabled { opacity: .45; cursor: not-allowed; }
  .qcopy.ok { background: var(--done-solid); color: #fff; }

  /* free-text inputs */
  .inputs-card { background: var(--card); border-radius: 24px; box-shadow: var(--shadow); padding: 26px 28px; margin-top: 20px; }
  .inputs-card h2 { margin: 0 0 14px; font-size: 13px; font-weight: 800; letter-spacing: .08em; color: var(--muted); }
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 13.5px; font-weight: 700; margin-bottom: 7px; }
  .field .req { color: var(--wait); }
  .field input, .field textarea {
    width: 100%; box-sizing: border-box; background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 13px; color: var(--text); font-size: 14px; font-family: inherit;
  }
  .field input:focus, .field textarea:focus { outline: 2px solid var(--brand1); border-color: transparent; }
  .field textarea { min-height: 72px; resize: vertical; }
  /* starts one line tall and grows with the content — write a single line or list several */
  .field textarea.in1 { min-height: 0; resize: none; overflow-y: hidden; line-height: 1.55; max-height: 240px; }
  .inputs-foot { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 16px; }
  .inputs-hint { flex: 1; min-width: 200px; font-size: 12.5px; color: var(--muted); line-height: 1.6; }

  /* bottom answer bar */
  .ansbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: none;
    background: var(--card); border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(0, 0, 0, .14);
    padding: 13px 0;   /* the horizontal padding lives on .inner so it matches #wrap exactly (edge alignment) */
  }
  .ansbar.show { display: block; }
  /* same width as #wrap — the bar used to be narrower and misaligned with the cards' right edge on wide screens */
  .ansbar .inner { margin: 0 auto; padding: 0 18px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  @media (min-width: 1100px) {
    .inputs-card { display: grid; grid-template-columns: 1fr 1fr; column-gap: 26px; align-items: start; }
    .inputs-card h2 { grid-column: 1 / -1; }
    .inputs-card .field.wide { grid-column: 1 / -1; }
    .inputs-card .inputs-foot { grid-column: 1 / -1; }
  }
  /* a one-line ellipsis cuts exactly what matters ("remaining items / input notice") — show two lines */
  .ansbar .preview {
    flex: 1 1 260px; font-size: 12.5px; color: var(--muted); line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  /* on narrow screens the bar folds into two rows (notice + button), so allow three lines; JS sizes the body's bottom padding to the bar */
  @media (max-width: 700px) { .ansbar .preview { -webkit-line-clamp: 3; } }
  .ansbar button.copy {
    background: var(--brand-solid); color: #fff; border: none; border-radius: 999px;
    padding: 12px 24px; font-size: 14px; font-weight: 800; cursor: pointer; flex: none;
  }
  .ansbar button.copy:disabled { opacity: .4; cursor: not-allowed; }
  .ansbar button.copy.ok { background: var(--done-solid); }
  /* "the sheet just changed under you" — shown where the user already is, not at the top */
  .ansbar .swapped {
    display: none; align-items: center; gap: 8px; flex: none;
    background: var(--brand-soft); color: var(--ink-brand); border-radius: 999px;
    padding: 8px 16px; font-size: 12.5px; font-weight: 800; white-space: nowrap;
  }
  .ansbar .swapped.show { display: inline-flex; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; line-height: 1.8; }
  .gate-error { background: var(--wait-soft); border: 2px solid var(--wait); border-radius: 18px; padding: 18px 22px; margin-bottom: 18px; color: var(--ink-wait); }
  .gate-error b { font-size: 15px; }
  .gate-error p { margin: 8px 0 10px; font-size: 13px; line-height: 1.7; }
  .gate-error ul { margin: 0; padding-left: 20px; font-size: 12.5px; line-height: 1.8; }
  /* the cards are keyboard-operable widgets, so the focus ring must be visible */
  .opt:focus-visible, .delegate:focus-visible, button:focus-visible, textarea:focus-visible {
    outline: 3px solid var(--brand1); outline-offset: 2px;
  }
  .empty { background: var(--card); border-radius: 24px; box-shadow: var(--shadow); text-align: center; padding: 90px 20px; color: var(--muted); line-height: 2; }
</style>
</head>
<body>
<div id="wrap">
  <div class="topbar"><button id="btnRefresh"></button><button id="btnTheme"></button></div>
  <div id="root">
    <div class="empty"></div>
  </div>
  <footer id="foot"></footer>
</div>
<div class="ansbar" id="ansbar"><div class="inner">
  <div class="preview" id="ansPreview"></div>
  <div class="swapped" id="swapped" role="status" aria-live="polite"></div>
  <button class="copy" id="btnCopy" disabled></button>
</div></div>

<script>
"use strict";
/* ---------- UI strings — English base, per-language overrides ----------
   Chrome language resolves in this order: MSW_DECISION.lang → browser language → English.
   The gate's own content (title/context/questions/options/inputs) is always authored by the
   session in the user's language and is never translated here. A language with no table
   falls back to English, so shipping a new locale means adding one entry below. */
var STR = {
  en: {
    docTitle: "Design choices", locale: "en-US",
    refresh: "🔄 Refresh", theme: "🌓 Theme",
    emptyTitle: "Nothing to choose right now.",
    emptyBody: "When the planning chat needs a decision, this sheet opens automatically.",
    barIdle: "Pick a card — each item has [📋 Copy this item] to paste into the matching chat question.",
    copyAll: "📋 Copy everything",
    effortLow: "Effort · low", effortMid: "Effort · medium", effortHigh: "Effort · high",
    gateBadge: "🤔 A design choice is needed",
    fallbackTitle: "Pick from these {n}",
    selmode: "📋 Use [Copy this item] on each one and paste them into the chat one at a time",
    modeMulti: "☑️ Pick any number", modeSingle: "◉ Pick one",
    selected: "✔ Selected", recommended: "★ Recommended",
    buildsSect: "What this builds",
    firstBuild: "🎮 <b>First result</b> · ", tradeoff: "⚖️ <b>What it postpones</b> · ",
    samples: "Similar games · ",
    delegate: "🤝 You decide this one (go with the recommendation)",
    custom: "✏️ My answer isn't listed (write it in)",
    notePh: "Anything to add to this item? (optional)",
    customPh: "Write the answer you want here (this is what gets sent)",
    copyOne: "📋 Copy this item", copyOnePlus: "📋 Copy this item + inputs",
    inputsTitle: "Write-in", inputsH2: "✍️ Write-in",
    inputsCtx: "These aren't picked, they're written (you may leave them blank).\nFill them in first and they ride along when you copy the last question. If you filled them in later, send them with [📋 Copy this item] below.",
    noteLabel: "Extra notes (optional)",
    notePh2: "Why you chose it, or anything you'd like — write freely",
    inputsHint: "Answering one question at a time? Send these values with this button too",
    footGen: "Generated · ",
    footMulti: "When the chat asks one question at a time, use <b>[📋 Copy this item]</b> and paste each answer into its question. Anything in <b>Write-in</b> rides along <b>when you copy the last item</b>. If your chat takes them all at once, use <b>[📋 Copy everything]</b> below.",
    footSingle: "Pick a card, fill anything in, then <b>[📋 Copy everything]</b> → paste it into the chat and it's decided.",
    footSplit: "<br>Depending on the chat, the questions may arrive <b>in batches rather than all at once</b>. If so, answering keeps them coming until <b>all {n} have been asked</b> — nothing was cut off.",

    ansDelegate: "(delegated — go with the recommendation)",
    ansCustom: "(not in the options · written in) ",
    blockOne: "[Planning answer {n}/{total} · gate {gate}]",
    blockInputs: "[Planning answer · inputs · gate {gate}]",
    blockAll: "[Planning answer · gate {gate}]",
    notePrefix: "note", extraNote: "Extra notes",
    barProgress: "Picked {done}/{total} — use each item's [📋 Copy this item] and paste it into the matching chat question",
    barRemaining: " (remaining: {list})",
    barDone: "All {total} picked — paste them item by item, or send everything at once with the button on the right",
    barRequired: "  ·  ⚠ Fill the required input (*)",
    barPending: "  ·  ✍️ Your write-in values haven't been sent yet — they ride along with the last item's [📋 Copy this item + inputs], or use the copy button in the write-in card",
    barOptional: "  ·  ✍️ The write-in fields are optional — fill them now and they go out with the last item",
    copyFail: "Copy failed. Please copy the text below manually:\n\n",
    copiedPaste: "✔ Copied! Paste it into the chat",
    copiedWithInputs: "✔ Copied! (write-in included)",
    copiedThisQ: "✔ Copied! Paste it into this question",
    refreshSame: "✔ Already up to date", refreshNew: "✔ Updated to the new questions", refreshBroken: "⚠ Could not read the data", refreshClosed: "✔ That question is settled — nothing to choose now",
    swapped: "🔄 The chat sent a new question — this sheet just updated"
    , checking: "⏳ Checking…", errTitle: "Something went wrong while drawing the choices.", errBody: "Please ask for it again in the chat."
    , badGateTitle: "⚠ This sheet can't be answered as it stands",
    badGateBody: "The planning session has to fix the gate data and reopen the sheet. Copying is disabled so a broken answer can't be pasted into the chat.",
    barBlocked: "⚠ Copying is disabled — the gate data is incomplete (see the notice at the top)",
    probNoQuestion: "Q{i}: the question text is missing",
    probNoOptions: "Q{i} \"{q}\": no options — this question would silently vanish from the sheet",
    probNoId: "Q{i} \"{q}\": an option has no id",
    probDupId: "Q{i} \"{q}\": duplicate option id \"{id}\"",
    probNoTradeoff: "Q{i} \"{q}\" · option {id}: tradeoff is missing (required — it is what a text-only choice always loses)",
    probBadRecommended: "Q{i} \"{q}\": recommended \"{id}\" matches no option",
    probDupQid: "duplicate question id \"{id}\"",
    probOptionsType: "Q{i} \"{q}\": options is not a list",
    probQuestionsType: "questions is not a list — nothing can be drawn",
    probInputsType: "inputs is not a list — the write-in fields were skipped",
    probNoInputKey: "an input has no key",
    probDupInputKey: "duplicate input key \"{id}\" — the two fields would share one value",
    probReservedInputKey: "input key \"__note\" is reserved for the extra-notes box",
    probBadQuestion: "Q{i}: this entry is not an object (null/undefined?)",
    probBadOption: "Q{i} \"{q}\": one of the options is not an object (null/undefined?)",
    probBadInput: "one of the inputs is not an object (null/undefined?)",
    probNoQuestions: "the data declares no question — \"questions\" must be a non-empty list (or \"options\" for a single-question gate)",
    probReservedOptionId: "Q{i} \"{q}\": option id \"{id}\" is reserved by the form's own escapes",
    probDataError: "the gate data could not be used: {msg}",
    probDataType: "the gate data is not an object",
    probNoGateId: "gateId is missing — every gate needs its own id so an answer can be traced back to it",
  probBadGateId: "gateId contains a line break or a \"]\" — the id is printed inside every paste header, and either one would split that header in two",
  probIdNewline: "question {i} ({q}): id \"{id}\" contains a line break — every id anchors one line of the paste, so ids and keys must be single-line",
  probInputKeyNewline: "input key \"{id}\" contains a line break — ids and keys must be single-line",
    probNoLabel: "Q{i} \"{q}\": option \"{id}\" has no label — the card would be blank and the pasted answer unreadable",
    probNoQid: "Q{i}: the question has no id — every paste names it, so it cannot be left out",
    probNoInputLabel: "input \"{id}\" has no label — the box would be titled with its machine key",
    probIdType: "Q{i} \"{q}\": the id {id} is not text — ids come back out of the page as strings, so a number would never match",
    probTextType: "Q{i}: the question is {kind}, not text",
    probUnreachable: "This page was opened straight off the disk, so the browser refuses to read the gate data. Ask the chat to run the packer with --serve and open the http://127.0.0.1 address it prints.",
    renderFailed: "The sheet could not be drawn from this data. Ask the chat to write the gate again."
  },
  ko: {
    docTitle: "기획 선택지 비교", locale: "ko-KR",
    refresh: "🔄 새로고침", theme: "🌓 테마",

     where the user is actively working. Rate-limited, so a mousemove costs nothing. */
setInterval(watchTick, WATCH_MS);
document.addEventListener("visibilitychange", function () { if (!document.hidden) watchTick(); });
window.addEventListener("focus", watchTick);
/* they stopped typing: apply whatever was held back, then resume normal checking */
document.addEventListener("focusout", function () {
  setTimeout(function () {
    if (typingNow()) return;                     /* focus only moved to another box */
    if (pendingGate) {
      var held = pendingGate;
      pendingGate = null;
      /* Apply it only if nothing newer has read since. A fresher tick or refresh may already
         have put a NEWER gate on screen while this one waited — applying it then would roll
         the screen back to a gate the session has replaced. Read fresh instead. */
      if (held.gen === watchGen) { applyResult(held.res); return; }
    }
    watchTick();
  }, 300);
});
function watchSoon() { if (Date.now() - watchLast >= 2500) watchTick(); }
["pointerdown", "keydown", "wheel", "scroll", "mousemove"].forEach(function (ev) {
  document.addEventListener(ev, watchSoon, { passive: true });
});
document.getElementById("btnTheme").addEventListener("click", function () {
  document.body.classList.toggle("dark");
  storeSet("msw-viewer-dark", document.body.classList.contains("dark") ? "1" : "0");
});
/* render() must never leave a half-drawn or stale screen behind: on failure the sheet says so
   and copying stays disabled, instead of the previous gate's cards lingering under new data. */
function safeRender() {
  try { render(); return true; }
  catch (e) {
    GATE_PROBLEMS = [t("renderFailed")];
    try {
      document.getElementById("root").innerHTML =
        '<div class="gate-error" role="alert"><b>' + esc(t("badGateTitle")) + "</b><p>" + esc(t("renderFailed")) + "</p></div>";
      document.getElementById("ansbar").classList.add("show");
      updateBar();
    } catch (e2) { /* nothing else can be done here */ }
    if (window.console && console.error) console.error("[decision-sheet] render failed:", e);
    return false;
  }
}
(function init() {
  var d = storeGet("msw-viewer-dark");
  if (d === "1" || (d === null && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) document.body.classList.add("dark");
  applyLang();   /* chrome in the browser's language until the gate declares its own */
  /* The first read is asynchronous like any other, so a Refresh pressed while it is still in
     flight would otherwise be overwritten when the older initial reply finally lands. */
  var initGen = ++watchGen;
  loadGate(function (res) {
    if (initGen !== watchGen) return;   /* a refresh already superseded this read */
    adoptGate(res);
    gateReady = true;   /* only now may the watcher compare against something real */
    try { applyLang(); safeRender(); DATA_SIG = signature(); } catch (e) {
      document.getElementById("root").innerHTML = '<div class="empty">' + esc(t("errTitle")) + "<br>" + esc(t("errBody")) + "</div>";
    }
  });
})();
</script>
